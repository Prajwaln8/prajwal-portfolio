<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Prajwal N | .NET Full Stack Developer</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="description"
      content=".NET Full Stack Developer with 4.3 years of experience in C#, ASP.NET Core, .NET 8, Web API, SQL Server, financial applications, WPS, and enterprise API integrations."
    />
    <!-- Fonts & Icons -->
    <!-- <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Catamaran:200,300,400,500,600,700" rel="stylesheet"> -->
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/googleapis_Source.css" />
    <link rel="stylesheet" href="css/googleapis_Catamaran.css" />
    <!-- <link rel="stylesheet" href="css/FontAwesome_4.6.3.css" /> -->
  </head>

  <body>
    <div id="content"></div>
    <!-- <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>-->

    <script src="js/react.production.min.js"></script>
    <script src="js/react-dom.production.min.js"></script>
    <script src="js/babel.min.js"></script>

    <script type="text/babel">
      const DATA = {
        name: "Hey, I'm Prajwal",
        subtext: ".NET Full Stack Developer | Bangalore, India.",
        jobStatus: ".NET Full Stack Developer @ Joyalukkas Money Exchange",
        githubURL: "https://github.com/Prajwaln8",
        linkedinURL: "https://www.linkedin.com/in/prajwal-n-9a687128a/",
        resumeURL:
          "https://drive.google.com/file/d/1xlMHYc0U3woyP5QASdaDb2kbH7k4-GnS/view?usp=sharing",
      };

      const App = ({ profileData }) => {
        return (
          <div className="app">
            <Left {...profileData} />
            <Right {...profileData} />
          </div>
        );
      };

      const Left = ({ name, subtext, jobStatus, githubURL, linkedinURL }) => {
        return (
          <div className="left">
            <div className="bg-img"></div>
            <div className="left-inner">
              <div className="info">
                <h2 className="name">{name}</h2>
                <div className="subtext">{subtext}</div>
                <div className="jobStatus">{jobStatus}</div>
                <div className="social-links">
                  <a
                    href={githubURL}
                    target="_blank"
                    rel="noreferrer"
                    aria-label="GitHub profile"
                  >
                    <i className="fa fa-github"></i>
                  </a>
                  <a
                    href={linkedinURL}
                    target="_blank"
                    rel="noreferrer"
                    aria-label="LinkedIn profile"
                  >
                    <i className="fa fa-linkedin"></i>
                  </a>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const Right = ({ resumeURL }) => {
        return (
          <div className="right">
            <div className="right-inner">
              <section className="introduction">
                <h4>Professional Summary</h4>
                <div className="content">
                  <p className="intro-p">
                    .NET Full Stack Developer with 4.3 years of professional
                    experience designing, developing, and maintaining enterprise
                    applications using C#, ASP.NET Core, .NET 8, Web API, and SQL
                    Server. Experienced in developing and enhancing 200+ RESTful
                    APIs, migrating legacy ASP.NET applications to modern .NET
                    architecture, and implementing financial and payroll-related
                    solutions.
                  </p>
                  <p className="intro-p">
                    Hands-on experience in WPS Salary Collection, Remittance,
                    Rate Configuration, Payroll Card Charge Collection, and
                    12+ MOHRE API integrations. Developed WPS Portal functionality
                    supporting 1,000+ employee records, created 50+ RDLC reports,
                    and resolved 200+ production issues. Strong expertise in backend
                    development, database management, stored procedures, and
                    enterprise application integration.
                  </p>
                </div>
              </section>

              <section className="highlights">
                <h4>Career Highlights</h4>
                <div className="content">
                  <ul className="description">
                    <li>Developed and enhanced 200+ RESTful APIs using C#, ASP.NET Core, .NET 8, and ADO.NET.</li>
                    <li>Implemented 12+ MOHRE API integrations and worked across 10+ business modules.</li>
                    <li>Built WPS Portal functionality supporting 1,000+ employee records.</li>
                    <li>Developed 50+ RDLC reports and resolved 200+ production issues.</li>
                    <li>Migrated legacy ASP.NET applications to .NET 8 and improved Retail360 system efficiency by 30%.</li>
                  </ul>
                </div>
              </section>

              <section className="skills">
                <h4>Technical Skills</h4>
                <div className="content">
                  <div className="skill-category">
                    <strong>Languages & Frameworks:&nbsp;</strong>
                    C#, .NET 6/8, ASP.NET Core, ASP.NET MVC, Web API, Entity Framework,
                    ADO.NET, LINQ, Dapper
                  </div>
                  <div className="skill-category">
                    <strong>Frontend:&nbsp;</strong>
                    HTML, CSS, JavaScript, jQuery, AJAX, React (currently learning)
                  </div>
                  <div className="skill-category">
                    <strong>Databases & Reporting:&nbsp;</strong>
                    SQL Server, Stored Procedures, XML, RDLC Reports
                  </div>
                  <div className="skill-category">
                    <strong>Tools & Platforms:&nbsp;</strong>
                    Git, Postman, Swagger, Visual Studio, Windows Services, Azure Services
                  </div>
                  <div className="skill-category">
                    <strong>Software Design:&nbsp;</strong>
                    RESTful APIs, Microservices, Design Patterns
                  </div>
                </div>
              </section>

              <section className="experience">
                <h4>Professional Experience</h4>
                <div className="content">
                  <div className="exp-item">
                    <div className="job">
                      <span className="company">Joyalukkas Money Exchange — .NET Full Stack Developer</span>
                      <div className="duration">June 4, 2025 – Present</div>
                    </div>
                    <ul className="description">
                      <li>Developed and enhanced 200+ RESTful APIs using C#, ASP.NET Core, .NET 8, and ADO.NET.</li>
                      <li>Contributed to migrating legacy ASP.NET applications to ASP.NET Core and .NET 8.</li>
                      <li>Implemented 12+ MOHRE API integrations and worked on 10+ modules, including WPS Salary Collection, Remittance, Rate Configuration, and Payroll Card Charge Collection.</li>
                      <li>Developed WPS Portal functionality for employer and employee management and salary processing, supporting 10,000+ employee records.</li>
                      <li>Built backend integrations to synchronize employee and salary data across applications; developed 50+ RDLC reports.</li>
                      <li>Resolved 200+ production issues and optimized SQL Server queries, stored procedures, and ADO.NET operations.</li>
                    </ul>

                    <div className="job">
                      <span className="company">TalentPace — Full Stack Web Developer</span>
                      <div className="duration">August 2022 – May 23, 2025</div>
                    </div>
                    <div className="title">Himalaya Wellness Company Projects (August 2023 – May 2025)</div>
                    <ul className="description">
                      <li>Led the migration of Retail360 from MVC to .NET 8, improving system efficiency by 30%.</li>
                      <li>Enhanced 60+ APIs using Dapper, improving database performance by 25%, and developed 30+ APIs for the Vriddhi mobile application.</li>
                      <li>Resolved 80% of software bugs within 24 hours and monitored live issues, coordinating knowledge transfers with end users.</li>
                    </ul>
                    <div className="title">Genesis Projects (August 2022 – July 2023)</div>
                    <ul className="description">
                      <li>Developed 40+ APIs using Entity Framework and optimized stored procedures for faster data retrieval.</li>
                      <li>Led a four-member team delivering pest and disease management applications.</li>
                    </ul>
                  </div>
                </div>
              </section>

              <section className="projects">
                <h4>Selected Projects</h4>
                <div className="content">
                  <div className="project-item">
                    <div className="project-title">WPS Employer Portal — Joyalukkas Money Exchange</div>
                    <p className="project-desc">
                      Developed portal functionality for employers to register employees,
                      manage employee details, and submit or update salary collection data.
                      Integrated backend data synchronization with connected applications.
                    </p>
                  </div>
                  <div className="project-item">
                    <div className="project-title">Retail360 Migration & API Optimization — Himalaya Wellness</div>
                    <p className="project-desc">
                      Contributed to migration from MVC to .NET 8, improving system
                      efficiency by 30%; enhanced 60+ APIs using Dapper and developed
                      APIs for the Vriddhi mobile application.
                    </p>
                  </div>
                  <div className="project-item">
                    <div className="project-title">AMS (Activity Management System) — Genesis</div>
                    <p className="project-desc">
                      Web application for organizing and tracking meetings, with approval
                      workflows, expense tracking, and PDF reporting, built using
                      ASP.NET MVC and SQL Server.
                    </p>
                  </div>
                </div>
              </section>

              <section className="education">
                <h4>Education</h4>
                <div className="content">
                  <div className="university">Visvesvaraya Technological University, Mysore</div>
                  <div className="college">Master of Computer Applications (MCA)</div>
                  <div className="major"><strong>Major:</strong> Computer Science</div>
                  <div className="grad-date">Graduation: October 2022</div>
                </div>
              </section>

              <a className="resume" href={resumeURL} target="_blank" rel="noreferrer">
                <div className="resume-link">View / Download My Resume (PDF)</div>
              </a>

              <div className="last-updated">Last updated: November 2026</div>
            </div>
          </div>
        );
      };
      ReactDOM.createRoot(document.getElementById("content")).render(
        <App profileData={DATA} />
      );
    </script>
  </body>
</html>
